---
deployment:
  tasks:
    - export DEPLOYPATH=/home/usuario/public_html/ErpQa
    - /bin/cp -r * $DEPLOYPATH
    # Diagnóstico: verifica si el comando mail existe
    - which mail > $DEPLOYPATH/mail_path.log 2>&1
    # Diagnóstico: prueba con sendmail si mail falla
    - echo "El sistema ErpQa fue actualizado en $(date)" | /usr/sbin/sendmail FernandoRivasSoto@Gmail.Com 2> $DEPLOYPATH/sendmail_error.log
    # Diagnóstico: prueba con mailx si mail y sendmail fallan
    - echo "El sistema ErpQa fue actualizado en $(date)" | mailx -s "[ErpQa] Actualización de despliegue" FernandoRivasSoto@Gmail.Com 2> $DEPLOYPATH/mailx_error.log
    # Diagnóstico: prueba mail con remitente explícito y log de error
    - echo "El sistema ErpQa fue actualizado en $(date)" | mail -s "[ErpQa] Actualización de despliegue" -r "notificaciones@tudominio.com" FernandoRivasSoto@Gmail.Com 2> $DEPLOYPATH/mail_error.log
    # Línea original (puedes comentar si lo deseas)
    # - echo "El sistema ErpQa fue actualizado en $(date)" | mail -s "[ErpQa] Actualización de despliegue" FernandoRivasSoto@Gmail.Com

