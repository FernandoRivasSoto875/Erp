<!-- KEEP: HTML base para drag & drop flexible de campos y fieldsets -->
<!--
KEEP: Recomendaciones UX para experiencia única y flexible:
1. Permite arrastrar tanto campos individuales como grupos (fieldsets) entre cualquier pestaña, columna o zona.
2. Muestra visualmente el área de destino (hover highlight) y el placeholder de inserción.
3. Usa íconos de arrastre (fa-arrows-alt, fa-grip-vertical) para indicar que es movible.
4. Permite soltar en "elementos fuera del formulario" para ocultar temporalmente campos o grupos.
5. Al soltar, muestra animación de éxito y guarda automáticamente el JSON.
6. Permite deshacer el último movimiento (botón Undo).
7. Muestra tooltip con la ubicación actual y destino antes de soltar.
8. Si el usuario mueve un grupo, pregunta si quiere mover solo el grupo o también todos sus campos.
9. Permite duplicar campos/grupos con Ctrl+Arrastrar.
10. Accesibilidad: permite mover usando teclado (tab, flechas, enter).
11. Muestra un minimapa o breadcrumb de la estructura para navegación rápida.
12. Permite colapsar/expandir fieldsets y pestañas para mejor organización.
13. Guarda automáticamente el estado tras cada movimiento y muestra notificación.
14. Permite edición inline de títulos de pestañas, fieldsets y campos.
15. Muestra historial de cambios recientes y permite revertir.
-->
<!-- Requiere dragdrop-formulariodinamico.js y SortableJS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="../js/dragdrop-formulariodinamico.js"></script>

<div class="tabs-container sortable-tab" data-keep>
  <!-- KEEP: Cada pestaña es droppable -->
  <div class="tab" data-tab="0" data-keep>
    <div class="tab-title">Información Personal</div>
    <div class="rows sortable-row" data-keep>
      <div class="columns sortable-col" data-keep>
        <div class="draggable-fieldset" data-type="fieldset" data-name="datos_personales" data-keep>
          <div class="fieldset-title">Datos Personales</div>
          <div class="campos sortable-fieldset" data-keep>
            <div class="draggable-campo" data-type="field" data-name="nombre_completo" data-keep>Nombre Completo</div>
            <div class="draggable-campo" data-type="field" data-name="email" data-keep>Email</div>
            <div class="draggable-campo" data-type="field" data-name="clave_acceso" data-keep>Contraseña</div>
          </div>
        </div>
      </div>
      <div class="columns sortable-col" data-keep>
        <div class="draggable-fieldset" data-type="fieldset" data-name="datos_contacto" data-keep>
          <div class="fieldset-title">Información de Contacto</div>
          <div class="campos sortable-fieldset" data-keep>
            <div class="draggable-campo" data-type="field" data-name="telefono" data-keep>Teléfono</div>
            <div class="draggable-campo" data-type="field" data-name="direccion" data-keep>Dirección</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="tab" data-tab="1" data-keep>
    <div class="tab-title">Facturación</div>
    <div class="rows sortable-row" data-keep>
      <div class="columns sortable-col" data-keep>
        <div class="draggable-fieldset" data-type="fieldset" data-name="productos_factura" data-keep>
          <div class="fieldset-title">Detalle de Productos</div>
          <div class="campos sortable-fieldset" data-keep>
            <div class="draggable-campo" data-type="field" data-name="detalle_productos" data-keep>Detalle Productos</div>
          </div>
        </div>
      </div>
      <div class="columns sortable-col" data-keep>
        <div class="draggable-fieldset" data-type="fieldset" data-name="resumen_factura" data-keep>
          <div class="fieldset-title">Resumen y Totales</div>
          <div class="campos sortable-fieldset" data-keep>
            <div class="draggable-campo" data-type="field" data-name="total_factura" data-keep>Total Factura</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- KEEP: Contenedor de elementos fuera del formulario -->
<div id="elementos-fuera-container" class="sortable-fuera" data-keep>
  <div class="draggable-fieldset" data-type="fieldset" data-name="footer_legal" data-keep>
    <div class="fieldset-title">Términos y Condiciones</div>
    <div class="campos sortable-fieldset" data-keep>
      <div class="draggable-campo" data-type="field" data-name="aceptar_terminos" data-keep>Acepto los términos</div>
    </div>
  </div>
</div>

<!-- KEEP: Botón para marcar visualmente los cambios KEEP -->
<button onclick="marcarKeepUI()">Marcar KEEP</button>
